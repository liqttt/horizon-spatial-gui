id = "spatial_gui"
name = "Spatial GUI"
version = "0.1.0"
description = "Renders inventory and container screens as a 3D plane in the world with smooth third-person over-the-shoulder camera transitions. Horizon Rust port of Spatial GUI (MIT)."
authors = ["liqttt"]
license = "MIT"
credits = "Original concept and Java mod by tastytrash (https://github.com/tastytrash/Spatial-GUI, MIT License)"
homepage = "https://github.com/liqttt/horizon-spatial-gui"
issues = "https://github.com/liqttt/horizon-spatial-gui/issues"
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "f1bb66f353cf67f2aa4665293fc75c8d91186fc7"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.mixin]]
id = "spatial_hud_head"
target = "horizon_client::game::Game<'_>::hud"
kind = "HEAD"
helper = "src/mixins/hud_head.rs"
bindings = [
    { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
    { name = "size", ty = "[u32; 2]", value = "size" },
]

[[native.mixin]]
id = "spatial_hud_transform"
target = "horizon_client::game::titles::Game<'_>::draw_saving_indicator"
kind = "HEAD"
helper = "src/mixins/hud_transform.rs"
bindings = [
    { name = "batch", ty = "&mut HudBatch", value = "batch" },
]

[[native.mixin]]
id = "spatial_cursor_map"
target = "horizon_client::game::inventory_input::Game<'_>::inventory_drag_move"
kind = "HEAD"
helper = "src/mixins/cursor_map.rs"
bindings = [
    { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
]
